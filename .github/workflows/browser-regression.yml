name: Browser regression

on:
  push:
    branches:
      - fix/pre-deploy-2026-11-27
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install playwright openpyxl msoffcrypto-tool
          python -m playwright install --with-deps chromium
          sudo apt-get install -y poppler-utils fonts-noto-cjk
      - name: Verify JavaScript and run browser suites
        run: |
          node --check app.js
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/career-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl -fsS --retry 5 --retry-connrefused http://127.0.0.1:8765/ > /dev/null
          python tests/browser_regression.py
          python tests/stability_regression.py
